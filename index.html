<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>个人资产统计</title>
  <style>
    :root {
      --bg: #fff;
      --card: #f8fafc;
      --border: #e2e8f0;
      --text: #1e293b;
      --muted: #64748b;
      --primary: #3b82f6;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 16px;
      max-width: 900px;
      margin: 0 auto;
      -webkit-font-smoothing: antialiased;
    }
    h1 { font-size: 1.5rem; text-align: center; margin-bottom: 4px; }
    .subtitle { text-align: center; color: var(--muted); font-size: 0.85rem; margin-bottom: 20px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .card h2 { font-size: 1rem; margin-bottom: 12px; }
    .rates-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-items: end;
    }
    .rates-grid .full { grid-column: 1 / -1; }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 3px; }
    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 16px; /* 防止 iOS 缩放 */
      background: #fff;
      color: var(--text);
      -webkit-appearance: none;
    }
    input:focus, select:focus { outline: none; border-color: var(--primary); }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }
    .form-grid .full { grid-column: 1 / -1; }
    .mode-toggle {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }
    .mode-toggle > label {
      display: inline-flex !important;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
      color: var(--text);
      margin-bottom: 0;
      cursor: pointer;
    }
    .mode-toggle input[type="radio"] {
      width: 18px; height: 18px; margin: 0; accent-color: var(--primary);
    }
    .form-actions { display: flex; gap: 8px; margin-top: 10px; }
    button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-secondary { background: #e2e8f0; color: var(--text); }
    .btn-danger { background: #fee2e2; color: var(--danger); }
    .btn-success { background: #dcfce7; color: #166534; }
    .btn-sm { padding: 6px 10px; font-size: 0.8rem; }
    .actions-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .actions-bar > * { flex: 1 1 30%; min-width: 100px; text-align: center; }
    .total-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 10px;
      margin-bottom: 14px;
    }
    .total-box .value { font-size: 1.4rem; font-weight: 700; color: #1d4ed8; }
    .total-box .label { font-size: 0.85rem; color: var(--muted); }
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td {
      padding: 10px 8px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    th { background: #f1f5f9; font-weight: 600; color: #475569; font-size: 0.75rem; }
    .currency-tag {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 600;
      background: #e0e7ff;
      color: #3730a3;
    }
    .chart-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    #pieSvg { max-width: 240px; width: 100%; height: auto; }
    .percent-list {
      list-style: none;
      width: 100%;
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
    }
    .percent-list li {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.85rem;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .empty { text-align: center; color: var(--muted); padding: 24px; }
    .hidden { display: none !important; }
    .note { font-size: 0.75rem; color: var(--muted); margin-top: 6px; }
    .toast {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: #22c55e;
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      z-index: 9999;
      font-size: 0.9rem;
      pointer-events: none;
    }
    @media (min-width: 600px) {
      .form-grid { grid-template-columns: repeat(3, 1fr); }
      .rates-grid { grid-template-columns: 1fr 1fr auto; }
      .percent-list { grid-template-columns: 1fr 1fr; }
      .mode-toggle { flex-direction: row; gap: 20px; }
    }
  </style>
</head>
<body>
  <h1>个人资产统计</h1>
  <p class="subtitle">本地运行 · 数据保存在浏览器</p>

  <div class="card">
    <h2>💱 汇率设置</h2>
    <div class="rates-grid">
      <div>
        <label>1 USD = CNY</label>
        <input type="number" id="rateUSD" step="0.0001" min="0" value="6.70">
      </div>
      <div>
        <label>1 HKD = CNY</label>
        <input type="number" id="rateHKD" step="0.0001" min="0" value="0.855">
      </div>
      <div class="full">
        <button class="btn-primary" style="width:100%" onclick="saveRates()">保存汇率</button>
      </div>
    </div>
    <p class="note">修改汇率后所有外币资产会自动折算为人民币</p>
  </div>

  <div class="card">
    <h2 id="formTitle">➕ 添加资产项目</h2>
    <div class="mode-toggle">
      <label>
        <input type="radio" name="inputMode" value="calc" checked onchange="toggleMode()">
        <span>按份额 × 单价计算</span>
      </label>
      <label>
        <input type="radio" name="inputMode" value="total" onchange="toggleMode()">
        <span>直接输入总价值</span>
      </label>
    </div>
    <div class="form-grid">
      <div class="full">
        <label>项目名称 *</label>
        <input type="text" id="assetName" placeholder="例如：黄金 / 腾讯控股">
      </div>
      <div>
        <label>分类</label>
        <select id="assetCategory">
          <option value="股票">股票</option>
          <option value="基金">基金</option>
          <option value="黄金">黄金</option>
          <option value="流动现金">流动现金</option>
          <option value="银行理财">银行理财</option>
          <option value="其他">其他</option>
        </select>
      </div>
      <div>
        <label>货币 *</label>
        <select id="assetCurrency">
          <option value="CNY">人民币 (CNY)</option>
          <option value="USD">美元 (USD)</option>
          <option value="HKD">港币 (HKD)</option>
        </select>
      </div>
      <div id="qtyGroup">
        <label>份额/数量/克数 *</label>
        <input type="number" id="assetQty" step="any" min="0" placeholder="例如 13">
      </div>
      <div id="unitGroup">
        <label>每单位价值 *</label>
        <input type="number" id="assetUnit" step="any" min="0" placeholder="例如 900">
      </div>
      <div id="totalGroup" class="hidden full">
        <label>总价值 *</label>
        <input type="number" id="assetTotal" step="any" min="0" placeholder="总价值">
      </div>
    </div>
    <div class="form-actions">
      <button class="btn-primary" id="submitBtn" onclick="submitAsset()">添加项目</button>
      <button class="btn-secondary hidden" id="cancelBtn" onclick="cancelEdit()">取消</button>
    </div>
  </div>

  <div class="actions-bar">
    <button class="btn-success" onclick="exportData()">导出 JSON</button>
    <label class="btn-secondary" style="display:flex;align-items:center;justify-content:center;cursor:pointer;padding:10px 16px;border-radius:8px;">
      导入
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
    </label>
    <button class="btn-danger" onclick="clearAll()">清空</button>
  </div>

  <div class="total-box">
    <div>
      <div class="label">总资产（人民币）</div>
      <div class="value" id="grandTotal">¥ 0.00</div>
    </div>
    <div style="font-size:0.8rem;color:var(--muted)" id="itemCount">共 0 项</div>
  </div>

  <div class="card">
    <h2>📋 资产明细</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>名称</th>
            <th>分类</th>
            <th>货币</th>
            <th>数量</th>
            <th>单价</th>
            <th>原币价值</th>
            <th>人民币</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="assetTableBody"></tbody>
      </table>
    </div>
    <div id="emptyMsg" class="empty">暂无资产，请在上方添加</div>
  </div>

  <div class="card">
    <h2>📊 资产占比</h2>
    <div class="chart-wrap">
      <svg id="pieSvg" viewBox="0 0 200 200"></svg>
      <ul class="percent-list" id="percentList"></ul>
    </div>
  </div>

  <script>
    let assets = [];
    let rates = { USD: 6.70, HKD: 0.855 };
    let editingId = null;

    const COLORS = ['#3b82f6','#22c55e','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#ec4899','#84cc16','#f97316','#6366f1'];

    function loadData() {
      try {
        const s = localStorage.getItem('personalAssets');
        if (s) {
          const d = JSON.parse(s);
          assets = d.assets || [];
          rates = d.rates || rates;
        }
      } catch (e) {}
      document.getElementById('rateUSD').value = rates.USD;
      document.getElementById('rateHKD').value = rates.HKD;
      render();
    }

    function saveData() {
      try {
        localStorage.setItem('personalAssets', JSON.stringify({ assets, rates }));
      } catch (e) {}
    }

    function saveRates() {
      const usd = parseFloat(document.getElementById('rateUSD').value);
      const hkd = parseFloat(document.getElementById('rateHKD').value);
      if (isNaN(usd) || usd <= 0 || isNaN(hkd) || hkd <= 0) {
        alert('请输入有效正数汇率');
        return;
      }
      rates.USD = usd;
      rates.HKD = hkd;
      saveData();
      render();
      showToast('汇率已更新');
    }

    function toCNY(amount, currency) {
      if (currency === 'USD') return amount * rates.USD;
      if (currency === 'HKD') return amount * rates.HKD;
      return amount;
    }

    function toggleMode() {
      const isCalc = document.querySelector('input[name="inputMode"]:checked').value === 'calc';
      document.getElementById('qtyGroup').classList.toggle('hidden', !isCalc);
      document.getElementById('unitGroup').classList.toggle('hidden', !isCalc);
      document.getElementById('totalGroup').classList.toggle('hidden', isCalc);
    }

    function submitAsset() {
      const name = document.getElementById('assetName').value.trim();
      const category = document.getElementById('assetCategory').value;
      const currency = document.getElementById('assetCurrency').value;
      const mode = document.querySelector('input[name="inputMode"]:checked').value;

      if (!name) { alert('请填写项目名称'); return; }

      let quantity = null, unitPrice = null, totalValue = 0;

      if (mode === 'calc') {
        const q = document.getElementById('assetQty').value.trim();
        const u = document.getElementById('assetUnit').value.trim();
        if (!q || !u) { alert('请填写份额和单价'); return; }
        quantity = parseFloat(q);
        unitPrice = parseFloat(u);
        if (isNaN(quantity) || quantity < 0 || isNaN(unitPrice) || unitPrice < 0) {
          alert('份额和单价必须是非负数'); return;
        }
        totalValue = quantity * unitPrice;
      } else {
        const t = document.getElementById('assetTotal').value.trim();
        if (!t) { alert('请填写总价值'); return; }
        totalValue = parseFloat(t);
        if (isNaN(totalValue) || totalValue < 0) { alert('总价值必须是非负数'); return; }
      }

      const item = {
        id: editingId || (Date.now().toString(36) + Math.random().toString(36).slice(2, 6)),
        name, category, currency, quantity, unitPrice, totalValue, mode
      };

      if (editingId) {
        const i = assets.findIndex(a => a.id === editingId);
        if (i !== -1) assets[i] = item;
        cancelEdit();
      } else {
        assets.push(item);
      }

      saveData();
      clearForm();
      render();
      showToast('已添加：' + name);
    }

    function clearForm() {
      document.getElementById('assetName').value = '';
      document.getElementById('assetQty').value = '';
      document.getElementById('assetUnit').value = '';
      document.getElementById('assetTotal').value = '';
      document.getElementById('assetCategory').value = '股票';
      document.getElementById('assetCurrency').value = 'CNY';
      document.querySelector('input[name="inputMode"][value="calc"]').checked = true;
      toggleMode();
    }

    function editAsset(id) {
      const item = assets.find(a => a.id === id);
      if (!item) return;
      editingId = id;
      document.getElementById('formTitle').textContent = '✏️ 编辑资产';
      document.getElementById('submitBtn').textContent = '保存';
      document.getElementById('cancelBtn').classList.remove('hidden');
      document.getElementById('assetName').value = item.name;
      document.getElementById('assetCategory').value = item.category;
      document.getElementById('assetCurrency').value = item.currency;
      if (item.mode === 'calc' && item.quantity != null) {
        document.querySelector('input[name="inputMode"][value="calc"]').checked = true;
        document.getElementById('assetQty').value = item.quantity;
        document.getElementById('assetUnit').value = item.unitPrice;
      } else {
        document.querySelector('input[name="inputMode"][value="total"]').checked = true;
        document.getElementById('assetTotal').value = item.totalValue;
      }
      toggleMode();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelEdit() {
      editingId = null;
      document.getElementById('formTitle').textContent = '➕ 添加资产项目';
      document.getElementById('submitBtn').textContent = '添加项目';
      document.getElementById('cancelBtn').classList.add('hidden');
      clearForm();
    }

    function deleteAsset(id) {
      if (!confirm('确定删除？')) return;
      assets = assets.filter(a => a.id !== id);
      if (editingId === id) cancelEdit();
      saveData();
      render();
    }

    function render() {
      const tbody = document.getElementById('assetTableBody');
      const emptyMsg = document.getElementById('emptyMsg');
      tbody.innerHTML = '';

      if (assets.length === 0) {
        emptyMsg.classList.remove('hidden');
        document.getElementById('grandTotal').textContent = '¥ 0.00';
        document.getElementById('itemCount').textContent = '共 0 项';
        drawPie([]);
        return;
      }
      emptyMsg.classList.add('hidden');

      let grand = 0;
      const chartData = [];
      const frag = document.createDocumentFragment();

      for (let i = 0; i < assets.length; i++) {
        const item = assets[i];
        const cny = toCNY(item.totalValue, item.currency);
        grand += cny;
        chartData.push({ name: item.name, value: cny, color: COLORS[i % COLORS.length] });

        const tr = document.createElement('tr');
        tr.innerHTML =
          '<td><strong>' + esc(item.name) + '</strong></td>' +
          '<td>' + esc(item.category) + '</td>' +
          '<td><span class="currency-tag">' + item.currency + '</span></td>' +
          '<td>' + (item.quantity != null ? fmt(item.quantity) : '—') + '</td>' +
          '<td>' + (item.unitPrice != null ? fmt(item.unitPrice) : '—') + '</td>' +
          '<td>' + fmt(item.totalValue) + ' ' + item.currency + '</td>' +
          '<td><strong>¥ ' + fmt(cny) + '</strong></td>' +
          '<td><button class="btn-secondary btn-sm" onclick="editAsset(\'' + item.id + '\')">编辑</button> ' +
          '<button class="btn-danger btn-sm" onclick="deleteAsset(\'' + item.id + '\')">删除</button></td>';
        frag.appendChild(tr);
      }
      tbody.appendChild(frag);

      document.getElementById('grandTotal').textContent = '¥ ' + fmt(grand);
      document.getElementById('itemCount').textContent = '共 ' + assets.length + ' 项';
      drawPie(chartData, grand);
    }

    // 轻量 SVG 饼图（无外部库）
    function drawPie(data, total) {
      const svg = document.getElementById('pieSvg');
      const list = document.getElementById('percentList');
      list.innerHTML = '';
      svg.innerHTML = '';

      if (!data.length || !total || total <= 0) {
        list.innerHTML = '<li style="justify-content:center;color:#64748b">暂无数据</li>';
        return;
      }

      const cx = 100, cy = 100, r = 90;
      let angle = -Math.PI / 2; // 从顶部开始

      for (let i = 0; i < data.length; i++) {
        const d = data[i];
        const slice = (d.value / total) * Math.PI * 2;
        const x1 = cx + r * Math.cos(angle);
        const y1 = cy + r * Math.sin(angle);
        angle += slice;
        const x2 = cx + r * Math.cos(angle);
        const y2 = cy + r * Math.sin(angle);
        const large = slice > Math.PI ? 1 : 0;

        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', 'M' + cx + ',' + cy + ' L' + x1 + ',' + y1 + ' A' + r + ',' + r + ' 0 ' + large + ' 1 ' + x2 + ',' + y2 + ' Z');
        path.setAttribute('fill', d.color);
        svg.appendChild(path);

        const pct = ((d.value / total) * 100).toFixed(1);
        const li = document.createElement('li');
        li.innerHTML = '<span class="dot" style="background:' + d.color + '"></span><span><strong>' + esc(d.name) + '</strong>：¥ ' + fmt(d.value) + '（' + pct + '%）</span>';
        list.appendChild(li);
      }
    }

    function exportData() {
      const payload = { version: 1, exportTime: new Date().toISOString(), rates, assets };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'assets_' + new Date().toISOString().slice(0, 10) + '.json';
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        try {
          const d = JSON.parse(ev.target.result);
          if (!d.assets || !Array.isArray(d.assets)) { alert('文件格式不正确'); return; }
          if (!confirm('导入 ' + d.assets.length + ' 个项目，覆盖当前数据？')) return;
          assets = d.assets;
          if (d.rates) {
            rates = d.rates;
            document.getElementById('rateUSD').value = rates.USD;
            document.getElementById('rateHKD').value = rates.HKD;
          }
          saveData();
          cancelEdit();
          render();
          showToast('导入成功');
        } catch (err) {
          alert('解析失败');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    }

    function clearAll() {
      if (!confirm('确定清空所有数据？')) return;
      assets = [];
      saveData();
      cancelEdit();
      render();
    }

    function fmt(n) {
      if (n == null || isNaN(n)) return '—';
      return Number(n).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 4 });
    }

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function showToast(msg) {
      const t = document.createElement('div');
      t.className = 'toast';
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(function() { t.remove(); }, 2000);
    }

    loadData();
  </script>
</body>
</html>
